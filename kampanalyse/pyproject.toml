[project]
name = "kampanalyse"
version = "0.1.0"
description = "Telegram-bot for nøktern fotballanalyse og spillforslag tilpasset Norsk Tipping"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22,<23",
    "httpx>=0.27,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["kampanalyse", "kampanalyse.providers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
