[project]
name = "fxsignal"
version = "0.1.0"
description = "Paper-first forex research, risk and Telegram signal system"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "pyarrow==26.0.0",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
fxsignal = "fxsignal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
